.customer-status{display:inline-block;padding:4px 8px;border-radius:5px;font-size:11px;background:#e9f7ef;color:#246745}
.customer-status.disabled{background:#f8ece8;color:#87492f}
.customer-row-actions{display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap;min-width:160px}
.customer-pagination{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0;font-size:12px;color:#46677d}
.customer-pagination small{margin-left:auto;font-size:11px}
.customer-error{padding:14px;border:1px solid #e6c1b5;border-radius:8px;background:#fff0eb;color:#843d27;font-size:13px;line-height:1.8;margin:16px 0}
.customer-empty{padding:26px;text-align:center;font-size:14px;color:#4b6c80}
@media(max-width:800px){.customer-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.personal-customers .section-title{align-items:flex-start;flex-direction:column}.customer-own-card{align-items:flex-start;flex-direction:column}.customer-stats>div{padding:14px}.customer-stats strong{font-size:24px}.customer-pagination small{margin-left:0}}
.personal-photo{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:24px}.personal-photo>span{font-size:13px;font-weight:600}.personal-photo img{border-radius:50%;object-fit:cover}.personal-photo input[type=file]{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.personal-photo small{font-size:11px;line-height:1.7;color:#506b7c}.personal-photo>p{color:#9d3f25}.personal-settings .image-upload{margin-bottom:24px}.personal-settings .secondary{margin-bottom:12px}.personal-photo .secondary{margin:0}
